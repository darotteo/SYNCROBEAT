# Deployment for Render (https://render.com). Import this repository there and it reads this file.
# Rooms live in the server's memory, so there must be exactly one instance: two instances would put
# the drummer and the guitarist of the same band in different rooms.
services:
  - type: web
    name: syncrobeat
    runtime: node
    # Matches the running service. A free instance sleeps after 15 minutes idle, so the first
    # musician to arrive waits for it to wake; during a rehearsal the open sockets keep it awake.
    # Moving to "starter" removes that wait and starts charging, so it stays a deliberate choice.
    plan: free
    region: oregon
    numInstances: 1
    # --omit=dev keeps the build light: everything needed to compile is a real dependency, and the
    # test tooling (which would download browsers) is not installed on the server
    buildCommand: npm ci --omit=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
